<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pick a name. Share the link. Watch instantly."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QUICK SCREEN" />
    <meta
      property="og:title"
      content="QUICK SCREEN — Fast browser screen sharing"
    />
    <meta
      property="og:description"
      content="Pick a name. Share the link. Watch instantly."
    />

    <meta
      property="og:image"
      content="https://share.ingamers.pro/og-preview.png?v=1"
    />
    <meta
      property="og:image:secure_url"
      content="https://share.ingamers.pro/og-preview.png?v=1"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="QUICK SCREEN — Fast browser screen sharing"
    />
    <meta
      name="twitter:description"
      content="Pick a name. Share the link. Watch instantly."
    />
    <meta
      name="twitter:image"
      content="https://share.ingamers.pro/og-preview.png?v=1"
    />
    <title>QUICK SCREEN</title>
    <script>
      (() => {
        const updateTitle = () => {
          const roomId = window.location.pathname.split("/").filter(Boolean)[0];
          document.title = roomId ? `${decodeURIComponent(roomId)} — QUICK SCREEN` : "QUICK SCREEN";
        };

        const wrapHistoryMethod = (methodName) => {
          const original = history[methodName];
          history[methodName] = function (...args) {
            const result = original.apply(this, args);
            updateTitle();
            return result;
          };
        };

        wrapHistoryMethod("pushState");
        wrapHistoryMethod("replaceState");
        window.addEventListener("popstate", updateTitle);
        updateTitle();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
