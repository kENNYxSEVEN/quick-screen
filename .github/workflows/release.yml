name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/media/go.mod
          cache-dependency-path: apps/media/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build deployment bundle
        run: pnpm build:deploy

      - name: Package release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="quick-screen-${TAG}-linux-amd64.tar.gz"

          rm -rf release-package
          mkdir -p release-package/quick-screen

          cp -a deploy/. release-package/quick-screen/
          cp LICENSE release-package/quick-screen/LICENSE
          printf '%s\n' "${TAG}" > release-package/quick-screen/VERSION

          chmod +x \
            release-package/quick-screen/install.sh \
            release-package/quick-screen/update.sh

          tar -C release-package -czf "${ARCHIVE}" quick-screen
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${ARCHIVE}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            --verify-tag \
            --title "QUICK SCREEN ${GITHUB_REF_NAME}" \
            --generate-notes
